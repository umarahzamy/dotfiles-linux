[settings]
minimum_release_age = "1d"

[tools]
# Runtime (a-z sort by name, method/org skipped)
"core:bun" = "1.3.13"
"conda:clang" = "21.1.8"
"core:go" = "1.26.5"
"core:java" = ["17", "21"]
"core:node" = "22.23.1"
"core:rust" = "1.97.1"
"github:astral-sh/uv" = "0.12.3"

# LS (a-z sort by name, method/org skipped)
"npm:@ansible/ansible-language-server" = "26.6.0"
"conda:basedpyright" = "1.39.8"
"npm:bash-language-server" = "5.6.0"
"conda:clang-tools" = "22.1.8"
"npm:dockerfile-language-server-nodejs" = "0.15.0"
"npm:@olrtg/emmet-language-server" = "2.8.0"
"go:golang.org/x/tools/gopls" = "0.23.0"
"github:umarahzamy/groovy-language-server" = { version = "v2026-05-19", bin_path = "bin" }
"github:mrjosh/helm-ls" = { version = "0.5.4" }
# "http:jdtls" = "1.60.0" (see [tools."http:jdtls"] below)
"github:fwcd/kotlin-language-server" = "1.3.13"
"npm:@astrojs/language-server" = "2.16.10"
"npm:@tailwindcss/language-server" = "0.14.29"
"npm:@vtsls/language-server" = "0.3.0"
"npm:@vue/language-server" = "3.3.7"
"github:LuaLS/lua-language-server" = "3.18.2"
"github:JohnnyMorganz/luau-lsp" = "1.69.0"
"github:phpactor/phpactor" = { version = "2026.06.25.0", bin = "phpactor", os = [
  "linux"
] }
"github:rust-lang/rust-analyzer" = "2026-06-15"
"npm:svelte-language-server" = { version = "0.18.0", trust_policy_excludes = [
  "svelte@4.2.20"
] }
"github:JFryy/systemd-lsp" = "v2026.08.03"
"github:Myriad-Dreamin/tinymist" = "0.15.2"
# "github:tombi-toml/tombi" = "1.2.4" TOML LS (see Formatter)
"npm:vscode-langservers-extracted" = "4.10.0"
"npm:yaml-language-server" = "1.24.0"

# Formatter (a-z sort by name, method/org skipped)
"npm:@biomejs/biome" = "2.5.4"
"conda:clang-format" = "22.1.8"
# "conda:clang-tools" = "22.1.8"
# "github:astral-sh/ruff" = "0.15.22" format
"github:mvdan/sh" = "3.13.1"
"npm:sql-formatter" = "15.7.4"
"github:JohnnyMorganz/StyLua" = "2.5.2"
"github:tombi-toml/tombi" = "1.2.4"
"github:Enter-tainer/typstyle" = "0.15.0"
"github:google/yamlfmt" = "0.21.0"

# Linter (a-z sort by name, method/org skipped)
# "npm:@biomejs/biome" = "2.5.4" lint
# "conda:clang-tools" = "22.1.8" clang-tidy
"github:hadolint/hadolint" = "2.14.0"
"github:astral-sh/ruff" = "0.15.22"
"github:Kampfkarren/selene" = { version = "0.31.0", matching_regex = "^selene-" }
"github:koalaman/shellcheck" = "0.11.0"
"conda:sqlfluff" = "4.2.2"
"github:terraform-linters/tflint" = "0.63.1"
# "github:tombi-toml/tombi" = "1.2.4" lint
"conda:yamllint" = "1.37.1"

# Others (a-z sort by name, method/org skipped)
"conda:ansible-lint" = "25.12.1"
"github:ast-grep/ast-grep" = "latest"
"github:atuinsh/atuin" = "latest"
"github:ccache/ccache" = "4.13.6"
"github:extrawurst/gitui" = "latest"
"github:herdrdev/herdr" = "latest"

"github:Perfare/Il2CppDumper" = { version = "latest", os = ["windows"], asset_pattern = "Il2CppDumper-win-v{{ version }}.zip" }
"github:neovim/neovim" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"github:sxyazi/yazi" = "latest"

# jdtls: eclipse mirror, pinned checksum
[tools."http:jdtls"]
version = "1.60.0"
url = "https://download.eclipse.org/jdtls/milestones/1.60.0/jdt-language-server-1.60.0-202606262232.tar.gz"
checksum = "sha256:e94c303d8198f977930803582738771fd18c52c5492878410bf222b1aa81ef1d"
size = "50925681"

# terraform-ls: hashicorp host
[tools."http:terraform-ls"]
version = "0.38.7"

[tools."http:terraform-ls".platforms]
linux-x64 = { url = "https://releases.hashicorp.com/terraform-ls/{{version}}/terraform-ls_{{version}}_linux_amd64.zip" }
windows-x64 = { url = "https://releases.hashicorp.com/terraform-ls/{{version}}/terraform-ls_{{version}}_windows_amd64.zip" }
